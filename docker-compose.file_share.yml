version: '3.3'

services:
  eaipannotator_server:
    volumes:
      - cvat_logs:/home/django/logs
      - cvat_data:/home/django/data
      - cvat_cache:/home/django/data/cache
    environment:
      CVAT_SHARE_URL: "Shared directory"

volumes:
  cvat_data:
    driver_opts:
      type: none
      device: /app/apps/eaip/data
      o: bind
  cvat_logs:
    driver_opts:
      type: none
      device: /app/apps/eaip/logs
      o: bind
  cvat_cache:
    driver_opts:
      type: none
      device: /app/apps/eaip/cache
      o: bind
